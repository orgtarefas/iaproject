<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FacePonto · Sistema SIMPLES que FUNCIONA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(8, 12, 25, 0.95);
            border-radius: 48px;
            padding: 20px;
            border: 1px solid rgba(0,255,136,0.2);
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            background: linear-gradient(135deg, #E0E7FF, #00ff88);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
        }
        .sub {
            text-align: center;
            color: #8e9bb5;
            font-size: 0.7rem;
            margin-bottom: 15px;
        }
        .video-wrapper {
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
            margin-bottom: 15px;
            box-shadow: 0 0 0 3px #1a2a4a;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        button {
            background: #1a2744;
            border: none;
            padding: 12px 16px;
            border-radius: 60px;
            font-weight: bold;
            color: white;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #2a3a60;
            flex: 1;
        }
        button:active { transform: scale(0.97); }
        .btn-success { background: #0a3a2a; border-color: #00ff88; }
        .btn-primary { background: #0f2b4a; border-color: #2c7da0; }
        .btn-danger { background: #3a1f2f; border-color: #ff4466; }
        .info-panel {
            background: #0a0e1ccc;
            border-radius: 28px;
            padding: 15px;
            margin-top: 10px;
        }
        .user-list {
            max-height: 160px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .user-item {
            background: #111a2b;
            border-radius: 20px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            border-left: 4px solid #00ff88;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #ff8888;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .status {
            background: #00000066;
            border-radius: 40px;
            padding: 10px;
            font-size: 0.7rem;
            text-align: center;
            margin-top: 10px;
        }
        .face-box {
            position: absolute;
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,255,136,0.5);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>👤 FACEPONTO</h1>
    <div class="sub">✅ Sistema de Reconhecimento Facial · Funciona sem baixar nada!</div>

    <div class="video-wrapper">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <button id="btnCamera" class="btn-primary">🔄 Trocar Câmera</button>
        <button id="btnRegister" class="btn-success">📸 CADASTRAR (8 fotos)</button>
        <button id="btnVerify" class="btn-primary">🔍 VERIFICAR PONTO</button>
    </div>
    <div id="sampleCounter" style="text-align:center; font-size:0.9rem; font-weight:bold; color:#00ff88;"></div>
    <div id="status" class="status">🚀 Inicializando câmera...</div>

    <div class="info-panel">
        <div style="display: flex; justify-content: space-between;">
            <span>👥 Funcionários Cadastrados</span>
            <button id="clearAll" style="background:#2a1a2a; border:none; padding:4px 12px; border-radius:20px; color:#ffaa88;">🗑️ Limpar</button>
        </div>
        <div id="userList" class="user-list"><div style="text-align:center; padding:20px;">📌 Nenhum rosto cadastrado</div></div>
    </div>
</div>

<script>
    // ==============================================================
    // SISTEMA DE RECONHECIMENTO FACIAL - VERSÃO SIMPLIFICADA
    // Usa Face Detection API nativa do navegador + hash do rosto
    // NÃO precisa baixar nenhum modelo externo!
    // ==============================================================
    
    let video = document.getElementById('video');
    let canvas = document.getElementById('canvas');
    let ctx = canvas.getContext('2d');
    let currentStream = null;
    let currentFacingMode = "user";
    let currentFaceData = null; // { hash, box }
    let detectionInterval = null;
    let isDetecting = false;
    
    // Banco de dados
    let users = [];
    let nextId = 1;
    
    // Cadastro
    let isRegistering = false;
    let registrationHashes = [];
    const REQUIRED_SAMPLES = 8;
    
    // Similaridade threshold (85%)
    const SIMILARITY_THRESHOLD = 0.85;
    
    // Face Detection API (nativa do Chrome)
    let faceDetector = null;
    
    // Elementos
    const statusDiv = document.getElementById('status');
    const sampleDiv = document.getElementById('sampleCounter');
    const userListDiv = document.getElementById('userList');
    
    // ========== UI ==========
    function renderUsers() {
        if (users.length === 0) {
            userListDiv.innerHTML = '<div style="text-align:center; padding:20px; color:#6e85b0;">📌 Nenhum rosto cadastrado</div>';
            return;
        }
        let html = '';
        users.forEach(user => {
            html += `
                <div class="user-item">
                    <div><strong>👤 ${escapeHtml(user.name)}</strong><br><span style="font-size:0.6rem;">ID #${user.id}</span></div>
                    <button class="delete-btn" onclick="deleteUser(${user.id})">🗑️</button>
                </div>
            `;
        });
        userListDiv.innerHTML = html;
    }
    
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
    
    window.deleteUser = (id) => {
        users = users.filter(u => u.id !== id);
        saveToStorage();
        renderUsers();
        statusDiv.innerHTML = `🗑️ Usuário removido.`;
    };
    
    function saveToStorage() {
        localStorage.setItem('facePontoSimple', JSON.stringify(users));
    }
    
    function loadFromStorage() {
        const raw = localStorage.getItem('facePontoSimple');
        if (raw) {
            try {
                users = JSON.parse(raw);
                if (users.length) nextId = Math.max(...users.map(u => u.id)) + 1;
                renderUsers();
            } catch(e) {}
        }
    }
    
    // ========== GERAR HASH ÚNICO DO ROSTO ==========
    // Baseado nas coordenadas da bounding box normalizada
    function generateFaceHash(box, imageData) {
        if (!box) return null;
        
        // Extrair características simples mas efetivas:
        // - Proporção do rosto (largura/altura)
        // - Posição central (x, y normalizado)
        // - Área do rosto
        // - Amostra de pixels da região (simplificado)
        
        const aspectRatio = box.width / box.height;
        const centerX = box.x + box.width / 2;
        const centerY = box.y + box.height / 2;
        const area = box.width * box.height;
        
        // Amostragem de cor da região do rosto (simplificada)
        let avgR = 0, avgG = 0, avgB = 0;
        let samples = 0;
        
        if (imageData) {
            const startX = Math.max(0, Math.floor(box.x));
            const startY = Math.max(0, Math.floor(box.y));
            const endX = Math.min(imageData.width, Math.floor(box.x + box.width));
            const endY = Math.min(imageData.height, Math.floor(box.y + box.height));
            
            for (let y = startY; y < endY; y += 8) {
                for (let x = startX; x < endX; x += 8) {
                    const idx = (y * imageData.width + x) * 4;
                    if (idx + 2 < imageData.data.length) {
                        avgR += imageData.data[idx];
                        avgG += imageData.data[idx + 1];
                        avgB += imageData.data[idx + 2];
                        samples++;
                    }
                }
            }
            if (samples > 0) {
                avgR /= samples;
                avgG /= samples;
                avgB /= samples;
            }
        }
        
        // Criar vetor de características
        const features = [
            aspectRatio,
            centerX,
            centerY,
            area / (video.videoWidth * video.videoHeight), // área normalizada
            avgR / 255,
            avgG / 255,
            avgB / 255
        ];
        
        return features;
    }
    
    // ========== CALCULAR SIMILARIDADE ==========
    function calculateSimilarity(hashA, hashB) {
        if (!hashA || !hashB || hashA.length !== hashB.length) return 0;
        
        let sum = 0;
        for (let i = 0; i < hashA.length; i++) {
            const diff = Math.abs(hashA[i] - hashB[i]);
            sum += diff;
        }
        const avgDiff = sum / hashA.length;
        // Converter distância para similaridade (menor distância = maior similaridade)
        return Math.max(0, 1 - avgDiff);
    }
    
    // ========== VERIFICAR ==========
    async function verifyFace() {
        if (!currentFaceData || !currentFaceData.hash) {
            statusDiv.innerHTML = "🤖 Nenhum rosto detectado. Centralize o rosto!";
            return false;
        }
        
        if (users.length === 0) {
            statusDiv.innerHTML = "📛 Nenhum funcionário cadastrado. Clique em CADASTRAR.";
            return false;
        }
        
        let bestMatch = null;
        let bestScore = -1;
        
        for (const user of users) {
            const score = calculateSimilarity(currentFaceData.hash, user.hash);
            if (score > bestScore) {
                bestScore = score;
                bestMatch = user;
            }
        }
        
        const percent = (bestScore * 100).toFixed(1);
        
        if (bestMatch && bestScore >= SIMILARITY_THRESHOLD) {
            const now = new Date().toLocaleString('pt-BR');
            statusDiv.innerHTML = `✅ PONTO REGISTRADO! ${bestMatch.name} · Certitude: ${percent}%<br>🕒 ${now}`;
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            return true;
        } else {
            statusDiv.innerHTML = `❌ ACESSO NEGADO! Similaridade: ${percent}% (mínimo ${SIMILARITY_THRESHOLD*100}%)`;
            return false;
        }
    }
    
    // ========== CADASTRAR ==========
    async function startRegistration() {
        if (isRegistering) {
            statusDiv.innerHTML = "⚠️ Cadastro em andamento...";
            return;
        }
        
        const name = prompt("👤 Digite o NOME do funcionário:", `Usuario_${nextId}`);
        if (!name || name.trim() === "") return;
        
        isRegistering = true;
        registrationHashes = [];
        let collected = 0;
        sampleDiv.innerHTML = `📸 Coletando: 0/${REQUIRED_SAMPLES}`;
        statusDiv.innerHTML = `🎯 Cadastro: vamos capturar ${REQUIRED_SAMPLES} imagens.`;
        
        const interval = setInterval(() => {
            if (!isRegistering) {
                clearInterval(interval);
                return;
            }
            
            if (currentFaceData && currentFaceData.hash) {
                registrationHashes.push([...currentFaceData.hash]);
                collected++;
                sampleDiv.innerHTML = `📸 Amostra ${collected}/${REQUIRED_SAMPLES} capturada!`;
                statusDiv.innerHTML = `✅ Amostra ${collected} de ${REQUIRED_SAMPLES}.`;
                
                if (collected >= REQUIRED_SAMPLES) {
                    clearInterval(interval);
                    finalizeRegistration(name.trim());
                }
            } else {
                statusDiv.innerHTML = `⚠️ Aguardando rosto... (${collected}/${REQUIRED_SAMPLES})`;
            }
        }, 800);
        
        setTimeout(() => {
            if (isRegistering && collected < REQUIRED_SAMPLES) {
                clearInterval(interval);
                isRegistering = false;
                sampleDiv.innerHTML = "";
                statusDiv.innerHTML = "❌ Cadastro cancelado: tempo excedido.";
            }
        }, 15000);
    }
    
    function finalizeRegistration(name) {
        isRegistering = false;
        if (registrationHashes.length === 0) {
            statusDiv.innerHTML = "❌ Cadastro falhou.";
            sampleDiv.innerHTML = "";
            return;
        }
        
        // Calcular média dos hashes
        const hashLength = registrationHashes[0].length;
        const avgHash = new Array(hashLength).fill(0);
        for (const hash of registrationHashes) {
            for (let i = 0; i < hashLength; i++) {
                avgHash[i] += hash[i];
            }
        }
        for (let i = 0; i < hashLength; i++) {
            avgHash[i] /= registrationHashes.length;
        }
        
        users.push({
            id: nextId++,
            name: name,
            hash: avgHash,
            timestamp: Date.now()
        });
        
        saveToStorage();
        renderUsers();
        sampleDiv.innerHTML = "";
        statusDiv.innerHTML = `✨ ${name} CADASTRADO! (${registrationHashes.length} amostras)`;
        if (navigator.vibrate) navigator.vibrate(200);
    }
    
    // ========== DETECÇÃO FACIAL COM FACE DETECTOR API ==========
    async function detectFace() {
        if (!faceDetector || !video.videoWidth) return;
        
        try {
            const faces = await faceDetector.detect(video);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (faces.length > 0) {
                const face = faces[0];
                const box = face.boundingBox;
                
                // Desenhar bounding box
                ctx.save();
                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 3;
                ctx.strokeRect(box.x, box.y, box.width, box.height);
                
                // Desenhar pontos de referência se disponíveis
                if (face.landmarks) {
                    for (const landmark of face.landmarks) {
                        ctx.beginPath();
                        ctx.arc(landmark.x, landmark.y, 2, 0, 2 * Math.PI);
                        ctx.fillStyle = '#00ffcc';
                        ctx.fill();
                    }
                }
                
                ctx.font = "bold 12px monospace";
                ctx.fillStyle = '#00ff88';
                ctx.fillText(`✅ Rosto detectado`, box.x, box.y - 8);
                ctx.restore();
                
                // Capturar imagem para hash
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = video.videoWidth;
                tempCanvas.height = video.videoHeight;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(video, 0, 0);
                const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                
                // Gerar hash
                const hash = generateFaceBox(box, imageData);
                currentFaceData = { hash, box };
                
            } else {
                currentFaceData = null;
                ctx.font = "16px 'Segoe UI'";
                ctx.fillStyle = '#ff8888';
                ctx.fillText("⚠️ Nenhum rosto encontrado", 20, 50);
            }
        } catch(err) {
            console.warn("Erro na detecção:", err);
        }
    }
    
    function generateFaceBox(box, imageData) {
        if (!box) return null;
        
        const aspectRatio = box.width / box.height;
        const centerX = (box.x + box.width / 2) / video.videoWidth;
        const centerY = (box.y + box.height / 2) / video.videoHeight;
        const area = (box.width * box.height) / (video.videoWidth * video.videoHeight);
        
        // Amostragem de cor
        let avgR = 0, avgG = 0, avgB = 0;
        let samples = 0;
        
        const startX = Math.max(0, Math.floor(box.x));
        const startY = Math.max(0, Math.floor(box.y));
        const endX = Math.min(imageData.width, Math.floor(box.x + box.width));
        const endY = Math.min(imageData.height, Math.floor(box.y + box.height));
        
        for (let y = startY; y < endY; y += 10) {
            for (let x = startX; x < endX; x += 10) {
                const idx = (y * imageData.width + x) * 4;
                if (idx + 2 < imageData.data.length) {
                    avgR += imageData.data[idx];
                    avgG += imageData.data[idx + 1];
                    avgB += imageData.data[idx + 2];
                    samples++;
                }
            }
        }
        if (samples > 0) {
            avgR /= samples;
            avgG /= samples;
            avgB /= samples;
        }
        
        return [aspectRatio, centerX, centerY, area, avgR / 255, avgG / 255, avgB / 255];
    }
    
    function startDetectionLoop() {
        if (detectionInterval) clearInterval(detectionInterval);
        detectionInterval = setInterval(() => {
            if (video.readyState === 4) {
                detectFace();
            }
        }, 100);
    }
    
    // ========== CÂMERA ==========
    async function initCamera(facingMode) {
        if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: facingMode }, width: { ideal: 640 }, height: { ideal: 480 } }
            });
            currentStream = stream;
            video.srcObject = stream;
            await video.play();
            setTimeout(() => {
                if (video.videoWidth) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }
            }, 200);
            return true;
        } catch(e) {
            try {
                const fallback = await navigator.mediaDevices.getUserMedia({ video: true });
                currentStream = fallback;
                video.srcObject = fallback;
                await video.play();
                return true;
            } catch(e2) {
                statusDiv.innerHTML = `🚫 Erro: ${e2.message}`;
                return false;
            }
        }
    }
    
    async function switchCamera() {
        currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
        await initCamera(currentFacingMode);
    }
    
    function clearAll() {
        if (confirm("⚠️ Apagar TODOS os rostos cadastrados?")) {
            users = [];
            nextId = 1;
            saveToStorage();
            renderUsers();
            statusDiv.innerHTML = "🧹 Todos os dados foram removidos.";
        }
    }
    
    async function onVerify() {
        if (!faceDetector) {
            statusDiv.innerHTML = "⏳ Aguarde inicialização...";
            return;
        }
        if (!currentFaceData || !currentFaceData.hash) {
            statusDiv.innerHTML = "🤖 Nenhum rosto detectado. Centralize o rosto!";
            return;
        }
        if (isRegistering) {
            statusDiv.innerHTML = "⏳ Cadastro em andamento, aguarde.";
            return;
        }
        await verifyFace();
    }
    
    // ========== INICIALIZAR ==========
    async function init() {
        loadFromStorage();
        
        // Tentar inicializar Face Detection API
        if (window.FaceDetector) {
            try {
                faceDetector = new FaceDetector({
                    maxDetectedFaces: 1,
                    fastMode: false
                });
                statusDiv.innerHTML = "✅ Face Detection API carregada!";
            } catch(e) {
                statusDiv.innerHTML = "⚠️ Face Detection API não disponível. Use Chrome/Edge.";
            }
        } else {
            statusDiv.innerHTML = "⚠️ Seu navegador não suporta Face Detection API. Use Chrome ou Edge.";
        }
        
        await initCamera('user');
        startDetectionLoop();
        
        document.getElementById('btnRegister').onclick = startRegistration;
        document.getElementById('btnVerify').onclick = onVerify;
        document.getElementById('btnCamera').onclick = switchCamera;
        document.getElementById('clearAll').onclick = clearAll;
    }
    
    init();
</script>
</body>
</html>
