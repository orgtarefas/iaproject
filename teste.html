<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FacePonto · Sistema Funcional com MediaPipe</title>
    <!-- MediaPipe FaceMesh - NÃO PRECISA DE ARQUIVOS EXTERNOS! -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(8, 12, 25, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 20px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            border: 1px solid rgba(0,255,136,0.2);
        }
        h1 {
            font-size: 1.6rem;
            text-align: center;
            background: linear-gradient(135deg, #E0E7FF, #00ff88);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
        }
        .sub {
            text-align: center;
            color: #8e9bb5;
            font-size: 0.7rem;
            margin-bottom: 15px;
        }
        .video-wrapper {
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
            margin-bottom: 15px;
            box-shadow: 0 0 0 3px #1a2a4a;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        button {
            background: #1a2744;
            border: none;
            padding: 12px 16px;
            border-radius: 60px;
            font-weight: bold;
            color: white;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #2a3a60;
            flex: 1;
        }
        button:active { transform: scale(0.97); }
        .btn-success { background: #0a3a2a; border-color: #00ff88; }
        .btn-primary { background: #0f2b4a; border-color: #2c7da0; }
        .btn-danger { background: #3a1f2f; border-color: #ff4466; }
        .info-panel {
            background: #0a0e1ccc;
            border-radius: 28px;
            padding: 15px;
            margin-top: 10px;
        }
        .user-list {
            max-height: 160px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .user-item {
            background: #111a2b;
            border-radius: 20px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            border-left: 4px solid #00ff88;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #ff8888;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .status {
            background: #00000066;
            border-radius: 40px;
            padding: 10px;
            font-size: 0.7rem;
            text-align: center;
            margin-top: 10px;
            font-family: monospace;
        }
        .sample-counter {
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: #00ff88;
            margin: 8px 0;
        }
        .badge {
            background: #00ff8822;
            color: #00ff88;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.65rem;
            text-align: center;
            display: inline-block;
            width: 100%;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔷 FACETECH</h1>
    <div class="badge">✅ MediaPipe FaceMesh · 468 pontos faciais · Funciona offline</div>

    <div class="video-wrapper">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <button id="btnCamera" class="btn-primary">🔄 Trocar Câmera</button>
        <button id="btnRegister" class="btn-success">📸 CADASTRAR (10 amostras)</button>
        <button id="btnVerify" class="btn-primary">🔍 VERIFICAR PONTO</button>
    </div>
    <div id="sampleCounter" class="sample-counter"></div>
    <div id="status" class="status">🚀 Inicializando MediaPipe FaceMesh...</div>

    <div class="info-panel">
        <div style="display: flex; justify-content: space-between;">
            <span>👥 Funcionários Cadastrados</span>
            <button id="clearAll" style="background:#2a1a2a; border:none; padding:4px 12px; border-radius:20px; color:#ffaa88;">🗑️ Limpar</button>
        </div>
        <div id="userList" class="user-list"><div style="text-align:center; padding:20px;">📌 Nenhum rosto cadastrado</div></div>
    </div>
</div>

<script>
    // ==============================================================
    // SISTEMA FACIAL COM MEDIAPIPE - 100% FUNCIONAL
    // Não precisa baixar arquivos externos!
    // ==============================================================
    
    let faceMesh = null;
    let currentStream = null;
    let currentFacingMode = "user";
    let isReady = false;
    let currentLandmarks = null;
    let currentDescriptor = null;
    let detectionInterval = null;
    
    // Banco de dados
    let users = [];
    let nextId = 1;
    
    // Cadastro
    let isRegistering = false;
    let samples = [];
    const REQUIRED_SAMPLES = 10;
    const SIMILARITY_THRESHOLD = 0.88; // 88% de similaridade (realista para MediaPipe)
    
    // Elementos
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const sampleDiv = document.getElementById('sampleCounter');
    const userListDiv = document.getElementById('userList');
    
    // ========== UI ==========
    function renderUsers() {
        if (users.length === 0) {
            userListDiv.innerHTML = '<div style="text-align:center; padding:20px; color:#6e85b0;">📌 Nenhum rosto cadastrado</div>';
            return;
        }
        let html = '';
        users.forEach(user => {
            html += `
                <div class="user-item">
                    <div><strong>👤 ${escapeHtml(user.name)}</strong><br><span style="font-size:0.6rem;">ID #${user.id}</span></div>
                    <button class="delete-btn" onclick="deleteUser(${user.id})">🗑️</button>
                </div>
            `;
        });
        userListDiv.innerHTML = html;
    }
    
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
    
    window.deleteUser = (id) => {
        users = users.filter(u => u.id !== id);
        saveToStorage();
        renderUsers();
        statusDiv.innerHTML = `🗑️ Usuário removido.`;
    };
    
    function saveToStorage() {
        const toStore = users.map(u => ({ ...u, descriptor: Array.from(u.descriptor) }));
        localStorage.setItem('faceTechDB', JSON.stringify(toStore));
    }
    
    function loadFromStorage() {
        const raw = localStorage.getItem('faceTechDB');
        if (raw) {
            try {
                const parsed = JSON.parse(raw);
                users = parsed.map(u => ({ ...u, descriptor: new Float32Array(u.descriptor) }));
                if (users.length) nextId = Math.max(...users.map(u => u.id)) + 1;
                renderUsers();
            } catch(e) {}
        }
    }
    
    // ========== EXTRAIR DESCRITOR DOS 468 PONTOS ==========
    function extractDescriptor(landmarks) {
        if (!landmarks || landmarks.length === 0) return null;
        const desc = [];
        for (let i = 0; i < landmarks.length; i++) {
            desc.push(landmarks[i].x);
            desc.push(landmarks[i].y);
            desc.push(landmarks[i].z);
        }
        return new Float32Array(desc);
    }
    
    // ========== SIMILARIDADE ==========
    function calculateSimilarity(descA, descB) {
        if (!descA || !descB || descA.length !== descB.length) return 0;
        let dot = 0, normA = 0, normB = 0;
        for (let i = 0; i < descA.length; i++) {
            dot += descA[i] * descB[i];
            normA += descA[i] * descA[i];
            normB += descB[i] * descB[i];
        }
        if (normA === 0 || normB === 0) return 0;
        return (dot / (Math.sqrt(normA) * Math.sqrt(normB)) + 1) / 2;
    }
    
    // ========== VERIFICAÇÃO ==========
    async function verifyFace(descriptor) {
        if (users.length === 0) {
            statusDiv.innerHTML = "📛 Nenhum funcionário cadastrado. Clique em CADASTRAR.";
            return false;
        }
        
        let bestMatch = null;
        let bestScore = -1;
        
        for (const user of users) {
            const score = calculateSimilarity(descriptor, user.descriptor);
            if (score > bestScore) {
                bestScore = score;
                bestMatch = user;
            }
        }
        
        const percent = (bestScore * 100).toFixed(2);
        
        if (bestMatch && bestScore >= SIMILARITY_THRESHOLD) {
            const now = new Date().toLocaleString('pt-BR');
            statusDiv.innerHTML = `✅ PONTO REGISTRADO! ${bestMatch.name} · Similaridade: ${percent}%<br>🕒 ${now}`;
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            return true;
        } else {
            statusDiv.innerHTML = `❌ ACESSO NEGADO! Melhor match: ${bestMatch?.name || 'Ninguém'} (${percent}%) · Mínimo: ${SIMILARITY_THRESHOLD*100}%`;
            return false;
        }
    }
    
    // ========== CADASTRO COM MÚLTIPLAS AMOSTRAS ==========
    async function startRegistration() {
        if (isRegistering) {
            statusDiv.innerHTML = "⚠️ Cadastro em andamento...";
            return;
        }
        
        const name = prompt("👤 Digite o NOME do funcionário:", `Usuario_${nextId}`);
        if (!name || name.trim() === "") return;
        
        isRegistering = true;
        samples = [];
        let collected = 0;
        sampleDiv.innerHTML = `📸 Coletando amostras: 0/${REQUIRED_SAMPLES}`;
        statusDiv.innerHTML = `🎯 Modo CADASTRO: vamos capturar ${REQUIRED_SAMPLES} imagens.`;
        
        const interval = setInterval(() => {
            if (!isRegistering) {
                clearInterval(interval);
                return;
            }
            
            if (currentDescriptor) {
                samples.push(new Float32Array(currentDescriptor));
                collected++;
                sampleDiv.innerHTML = `📸 Amostra ${collected}/${REQUIRED_SAMPLES} capturada!`;
                statusDiv.innerHTML = `✅ Amostra ${collected} de ${REQUIRED_SAMPLES}.`;
                
                if (collected >= REQUIRED_SAMPLES) {
                    clearInterval(interval);
                    finalizeRegistration(name.trim());
                }
            } else {
                statusDiv.innerHTML = `⚠️ Aguardando rosto... (${collected}/${REQUIRED_SAMPLES})`;
            }
        }, 800);
        
        setTimeout(() => {
            if (isRegistering && collected < REQUIRED_SAMPLES) {
                clearInterval(interval);
                isRegistering = false;
                sampleDiv.innerHTML = "";
                statusDiv.innerHTML = "❌ Cadastro cancelado: tempo excedido.";
            }
        }, 15000);
    }
    
    function finalizeRegistration(name) {
        isRegistering = false;
        if (samples.length === 0) {
            statusDiv.innerHTML = "❌ Cadastro falhou.";
            sampleDiv.innerHTML = "";
            return;
        }
        
        // Média dos descritores
        const descLen = samples[0].length;
        const finalDesc = new Float32Array(descLen);
        for (const sample of samples) {
            for (let i = 0; i < descLen; i++) {
                finalDesc[i] += sample[i];
            }
        }
        for (let i = 0; i < descLen; i++) {
            finalDesc[i] /= samples.length;
        }
        
        users.push({
            id: nextId++,
            name: name,
            descriptor: finalDesc,
            timestamp: Date.now()
        });
        
        saveToStorage();
        renderUsers();
        sampleDiv.innerHTML = "";
        statusDiv.innerHTML = `✨ ${name} CADASTRADO com sucesso! (${samples.length} amostras)`;
        if (navigator.vibrate) navigator.vibrate(200);
    }
    
    async function onVerify() {
        if (!isReady) {
            statusDiv.innerHTML = "⏳ Aguarde inicialização...";
            return;
        }
        if (!currentDescriptor) {
            statusDiv.innerHTML = "🤖 Nenhum rosto detectado. Centralize o rosto!";
            return;
        }
        if (isRegistering) {
            statusDiv.innerHTML = "⏳ Cadastro em andamento, aguarde.";
            return;
        }
        await verifyFace(currentDescriptor);
    }
    
    // ========== FACEMESH ==========
    function onFaceMeshResults(results) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            const landmarks = results.multiFaceLandmarks[0];
            currentLandmarks = landmarks;
            currentDescriptor = extractDescriptor(landmarks);
            
            // Desenhar bounding box
            let minX = 1, minY = 1, maxX = 0, maxY = 0;
            for (const pt of landmarks) {
                const x = (1 - pt.x) * canvas.width;
                const y = pt.y * canvas.height;
                minX = Math.min(minX, x);
                minY = Math.min(minY, y);
                maxX = Math.max(maxX, x);
                maxY = Math.max(maxY, y);
            }
            
            ctx.save();
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 3;
            ctx.strokeRect(minX - 8, minY - 8, (maxX - minX) + 16, (maxY - minY) + 16);
            
            // Desenhar todos os 468 pontos
            for (const pt of landmarks) {
                const x = (1 - pt.x) * canvas.width;
                const y = pt.y * canvas.height;
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, 2 * Math.PI);
                ctx.fillStyle = '#00ffcc';
                ctx.fill();
            }
            
            ctx.font = "bold 12px monospace";
            ctx.fillStyle = '#00ff88';
            ctx.fillText(`✅ ${landmarks.length} pontos faciais detectados`, minX - 8, minY - 12);
            ctx.restore();
            
        } else {
            currentDescriptor = null;
            ctx.font = "16px 'Segoe UI'";
            ctx.fillStyle = '#ff8888';
            ctx.fillText("⚠️ Nenhum rosto encontrado", 20, 50);
        }
    }
    
    async function processFrame() {
        if (!isReady || !video.videoWidth) return;
        try {
            await faceMesh.send({ image: video });
        } catch(e) {}
    }
    
    function startLoop() {
        if (detectionInterval) clearInterval(detectionInterval);
        detectionInterval = setInterval(processFrame, 80);
    }
    
    // ========== CÂMERA ==========
    async function initCamera(facingMode) {
        if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: facingMode }, width: { ideal: 640 }, height: { ideal: 480 } }
            });
            currentStream = stream;
            video.srcObject = stream;
            await video.play();
            setTimeout(() => {
                if (video.videoWidth) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }
            }, 200);
            return true;
        } catch(e) {
            try {
                const fallback = await navigator.mediaDevices.getUserMedia({ video: true });
                currentStream = fallback;
                video.srcObject = fallback;
                await video.play();
                return true;
            } catch(e2) {
                statusDiv.innerHTML = `🚫 Erro: ${e2.message}`;
                return false;
            }
        }
    }
    
    async function switchCamera() {
        currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
        await initCamera(currentFacingMode);
    }
    
    function clearAll() {
        if (confirm("⚠️ Apagar TODOS os rostos cadastrados?")) {
            users = [];
            nextId = 1;
            saveToStorage();
            renderUsers();
            statusDiv.innerHTML = "🧹 Todos os dados foram removidos.";
        }
    }
    
    // ========== INICIALIZAR MEDIAPIPE ==========
    async function initFaceMesh() {
        try {
            faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });
            
            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            
            faceMesh.onResults(onFaceMeshResults);
            isReady = true;
            statusDiv.innerHTML = "✅ SISTEMA PRONTO! 468 pontos faciais ativos.";
            console.log("FaceMesh carregado!");
        } catch(err) {
            console.error(err);
            statusDiv.innerHTML = "❌ Erro ao carregar MediaPipe. Recarregue a página.";
        }
    }
    
    // ========== INICIAR ==========
    window.addEventListener('load', async () => {
        loadFromStorage();
        await initFaceMesh();
        await initCamera('user');
        startLoop();
        
        document.getElementById('btnRegister').onclick = startRegistration;
        document.getElementById('btnVerify').onclick = onVerify;
        document.getElementById('btnCamera').onclick = switchCamera;
        document.getElementById('clearAll').onclick = clearAll;
    });
</script>
</body>
</html>
