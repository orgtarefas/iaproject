<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FacePonto · Reconhecimento Facial Definitivo</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 16px;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            font-size: 1.6rem;
            text-align: center;
            background: linear-gradient(135deg, #E0E7FF, #90F7EC);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
        }
        .sub {
            text-align: center;
            color: #8e9bb5;
            font-size: 0.7rem;
            margin-bottom: 20px;
        }
        .video-wrapper {
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
            margin-bottom: 20px;
            box-shadow: 0 0 0 3px #2d3f66;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        video {
            transform: scaleX(-1);
        }
        canvas {
            pointer-events: none;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #1f2a48;
            border: none;
            padding: 12px 18px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #334566;
            flex: 1;
            justify-content: center;
        }
        button:active { transform: scale(0.96); }
        .btn-primary { background: #0f3b5e; border-color: #2c7da0; }
        .btn-success { background: #0f3b2c; border-color: #2ecc71; }
        .btn-danger { background: #5e2a2a; border-color: #e06c6c; background: #3a1f2f; }
        
        .info-card {
            background: #0f1422cc;
            border-radius: 28px;
            padding: 16px;
            margin-top: 20px;
        }
        .user-list {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .user-item {
            background: #111a2b;
            border-radius: 20px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #00ff88;
        }
        .user-name { font-weight: bold; color: #d9e6ff; }
        .delete-btn { background: none; border: none; color: #ff7777; font-size: 1.2rem; cursor: pointer; padding: 0 8px; }
        .status-msg {
            background: #00000066;
            border-radius: 40px;
            padding: 10px;
            text-align: center;
            font-size: 0.75rem;
            color: #ccd6f0;
            margin-top: 15px;
        }
        .badge {
            background: #d4af37;
            color: #1a1a2e;
            font-size: 0.65rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }
        .sample-counter {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 8px;
            color: #d4af37;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>👤 FacePonto <span style="font-size: 0.6rem; background:#d4af37; color:#000; padding:2px 8px; border-radius:20px;">Face-Recognition-Net</span></h1>
    <div class="sub">🔒 Reconhecimento facial profissional | 128 pontos biométricos</div>

    <div class="video-wrapper">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <button id="btnSwitchCamera" class="btn-primary">🔄 Trocar Câmera</button>
        <button id="btnRegister" class="btn-success">✍️ CADASTRAR ROSTO</button>
        <button id="btnVerify" class="btn-primary" style="background:#2c3e66;">🔍 VERIFICAR PONTO</button>
    </div>
    <div class="status-msg" id="statusMsg">⚡ Inicializando IA e câmera...</div>
    <div id="sampleStatus" class="sample-counter"></div>

    <div class="info-card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span>🧠 Funcionários Cadastrados</span>
            <button id="clearAll" style="all:unset; cursor:pointer; background:#3a2a3a; padding:4px 12px; border-radius:20px; font-size:0.7rem;">🗑️ Limpar Tudo</button>
        </div>
        <div id="userList" class="user-list">
            <div style="text-align:center; padding:20px; color:#6e85b0;">Nenhum rosto cadastrado ainda.</div>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // SISTEMA COM FACE-API.JS (FaceRecognitionNet) - CORRETO PARA RECONHECIMENTO
    // --------------------------------------------------------------
    
    let modelsLoaded = false;
    let currentStream = null;
    let currentFacingMode = "user";
    let lastDescriptor = null;
    let detectionInterval = null;
    
    // Banco de dados
    let registeredUsers = [];
    let nextId = 1;
    
    // Controle de cadastro por amostragem
    let isRegistering = false;
    let tempDescriptors = [];
    const REQUIRED_SAMPLES = 5;
    
    // Configuração do Reconhecimento (Mais realista e robusto)
    const RECOGNITION_THRESHOLD = 0.6; // 60% de similaridade (face-api.js padrão, pessoas diferentes raramente passam de 0.4)
    
    // Elementos
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('statusMsg');
    const sampleDiv = document.getElementById('sampleStatus');
    const userListDiv = document.getElementById('userList');
    
    // Helper UI
    function renderUserList() {
        if (registeredUsers.length === 0) {
            userListDiv.innerHTML = '<div style="text-align:center; padding:20px; color:#6e85b0;">👤 Nenhum rosto cadastrado.</div>';
            return;
        }
        let html = '';
        registeredUsers.forEach(user => {
            html += `
                <div class="user-item">
                    <div><span class="user-name">👤 ${escapeHtml(user.name)}</span><br><span style="font-size:0.6rem;">#${user.id}</span></div>
                    <button class="delete-btn" onclick="deleteUser(${user.id})">🗑️</button>
                </div>
            `;
        });
        userListDiv.innerHTML = html;
    }
    
    window.deleteUser = (id) => {
        registeredUsers = registeredUsers.filter(u => u.id !== id);
        saveToLocalStorage();
        renderUserList();
        statusDiv.innerHTML = `🗑️ Usuário removido. Modo: Verificação`;
    };
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function saveToLocalStorage() {
        const toStore = registeredUsers.map(user => ({
            ...user,
            descriptor: Array.from(user.descriptor)
        }));
        localStorage.setItem('facePontoFinalDB', JSON.stringify(toStore));
    }
    
    function loadFromLocalStorage() {
        const raw = localStorage.getItem('facePontoFinalDB');
        if (raw) {
            try {
                const parsed = JSON.parse(raw);
                registeredUsers = parsed.map(user => ({
                    ...user,
                    descriptor: new Float32Array(user.descriptor)
                }));
                if (registeredUsers.length > 0) {
                    nextId = Math.max(...registeredUsers.map(u => u.id)) + 1;
                }
                renderUserList();
            } catch(e) { console.warn(e); }
        }
    }
    
    // Função principal de reconhecimento usando o descriptor do face-api.js
    async function recognizeFace(currentDesc) {
        if (registeredUsers.length === 0) {
            statusDiv.innerHTML = "📛 Nenhum funcionário cadastrado. Clique em CADASTRAR ROSTO.";
            return false;
        }
        if (!currentDesc) return false;
        
        let bestMatch = null;
        let bestDistance = Infinity; // face-api.js usa distância euclidiana, quanto menor, mais parecido
        
        for (const user of registeredUsers) {
            // Calcula distância euclidiana entre os descritores
            const distance = faceapi.euclideanDistance(currentDesc, user.descriptor);
            if (distance < bestDistance) {
                bestDistance = distance;
                bestMatch = user;
            }
        }
        
        // Converter distância para similaridade (quanto menor a distância, maior a similaridade)
        // Distância 0 = 100%, Distância 0.6 = ~70%, Distância 1.0 = 0%
        const similarity = Math.max(0, 1 - (bestDistance / 1.2));
        const percent = (similarity * 100).toFixed(2);
        
        // Exibir no status a porcentagem para debug
        statusDiv.innerHTML = `🔍 Análise: Similaridade com ${bestMatch?.name}: ${percent}% (Limite: ${RECOGNITION_THRESHOLD*100}%)`;
        
        if (bestMatch && similarity >= RECOGNIGlTHRESHOLD) {
            const now = new Date().toLocaleString('pt-BR');
            statusDiv.innerHTML = `✅ PONTO REGISTRADO! ${bestMatch.name} · Confiança: ${percent}%<br>🕒 ${now}`;
            if (navigator.vibrate) navigator.vibrate(200);
            return true;
        } else {
            statusDiv.innerHTML = `❌ ACESSO NEGADO! Melhor match: ${bestMatch?.name || 'Ninguém'} (${percent}%)<br>🔍 Mínimo necessário: ${RECOGNITION_THRESHOLD*100}%`;
            return false;
        }
    }
    
    // Cadastro por MÚLTIPLAS AMOSTRAS (Faz média dos descritores para ficar mais robusto)
    async function startRegistration() {
        if (isRegistering) {
            statusDiv.innerHTML = "⚠️ Já está cadastrando, aguarde...";
            return;
        }
        
        const name = prompt("👤 Digite o NOME do funcionário:", `Usuario_${nextId}`);
        if (!name || name.trim() === "") return;
        
        isRegistering = true;
        tempDescriptors = [];
        sampleDiv.innerHTML = `📸 Coletando amostras faciais: 0/${REQUIRED_SAMPLES}. Mova levemente o rosto.`;
        statusDiv.innerHTML = `Modo CADASTRO ativo. Vamos tirar ${REQUIRED_SAMPLES} fotos do seu rosto.`;
        
        let samplesCollected = 0;
        
        // Função que coleta as amostras
        const collector = setInterval(() => {
            if (!isRegistering) {
                clearInterval(collector);
                return;
            }
            
            if (lastDescriptor) {
                tempDescriptors.push(lastDescriptor);
                samplesCollected++;
                sampleDiv.innerHTML = `📸 Coletando: ${samplesCollected}/${REQUIRED_SAMPLES}. Mantenha o rosto visível.`;
                
                if (samplesCollected >= REQUIRED_SAMPLES) {
                    clearInterval(collector);
                    finalizeRegistration(name.trim());
                }
            } else {
                statusDiv.innerHTML = "⚠️ Nenhum rosto detectado. Centralize bem o rosto!";
            }
        }, 800); // uma amostra a cada 0.8 segundos
        
        // Timeout de segurança
        setTimeout(() => {
            if (isRegistering && samplesCollected < REQUIRED_SAMPLES) {
                clearInterval(collector);
                isRegistering = false;
                sampleDiv.innerHTML = "";
                statusDiv.innerHTML = "❌ Cadastro falhou: tempo esgotado. Certifique-se de que o rosto está aparecendo.";
            }
        }, 10000);
    }
    
    function finalizeRegistration(name) {
        isRegistering = false;
        if (tempDescriptors.length === 0) {
            statusDiv.innerHTML = "❌ Nenhuma amostra válida. Cadastro cancelado.";
            sampleDiv.innerHTML = "";
            return;
        }
        
        // Média dos descritores para criar um template robusto
        const descriptorLength = tempDescriptors[0].length;
        const avgDescriptor = new Float32Array(descriptorLength);
        for (const desc of tempDescriptors) {
            for (let i = 0; i < descriptorLength; i++) {
                avgDescriptor[i] += desc[i];
            }
        }
        for (let i = 0; i < descriptorLength; i++) {
            avgDescriptor[i] /= tempDescriptors.length;
        }
        
        registeredUsers.push({
            id: nextId++,
            name: name,
            descriptor: avgDescriptor,
            timestamp: Date.now()
        });
        
        saveToLocalStorage();
        renderUserList();
        sampleDiv.innerHTML = "";
        statusDiv.innerHTML = `✨ ${name} CADASTRADO com sucesso! (${tempDescriptors.length} amostras integradas)`;
        if (navigator.vibrate) navigator.vibrate(100);
    }
    
    // DETECÇÃO CONTÍNUA (Face-api.js)
    async function detectLoop() {
        if (!modelsLoaded || !video.videoWidth) return;
        
        try {
            const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks()
                .withFaceDescriptor();
            
            // Desenhar no canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (detection) {
                lastDescriptor = detection.descriptor;
                const box = detection.detection.box;
                ctx.save();
                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 3;
                ctx.strokeRect(box.x, box.y, box.width, box.height);
                
                // Desenhar landmarks
                if (detection.landmarks) {
                    for (const point of detection.landmarks.positions) {
                        ctx.beginPath();
                        ctx.arc(point.x, point.y, 2, 0, 2 * Math.PI);
                        ctx.fillStyle = '#00ffcc';
                        ctx.fill();
                    }
                }
                ctx.font = "bold 14px 'Segoe UI'";
                ctx.fillStyle = '#00ff88';
                ctx.fillText("✅ Rosto Detectado", box.x, box.y - 8);
                ctx.restore();
            } else {
                lastDescriptor = null;
                ctx.font = "16px 'Segoe UI'";
                ctx.fillStyle = '#ff8888';
                ctx.fillText("⚠️ Nenhum rosto encontrado", 20, 50);
            }
        } catch(err) {
            console.warn(err);
        }
    }
    
    // Iniciar loop
    function startDetection() {
        if (detectionInterval) clearInterval(detectionInterval);
        detectionInterval = setInterval(() => {
            if (modelsLoaded && video.readyState === 4) detectLoop();
        }, 100);
    }
    
    // Ações dos botões
    async function onVerify() {
        if (!modelsLoaded) { statusDiv.innerHTML = "⏳ IA carregando..."; return; }
        if (!lastDescriptor) { statusDiv.innerHTML = "🤖 Nenhum rosto detectado. Centralize o rosto!"; return; }
        if (isRegistering) { statusDiv.innerHTML = "⚠️ Espere o cadastro terminar."; return; }
        await recognizeFace(lastDescriptor);
    }
    
    // CÂMERA
    async function initCamera(facingMode) {
        if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: facingMode }, width: { ideal: 640 }, height: { ideal: 480 } }
            });
            currentStream = stream;
            video.srcObject = stream;
            await video.play();
            setTimeout(() => {
                if (video.videoWidth) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }
            }, 200);
            statusDiv.innerHTML = `📷 Câmera ${facingMode === 'user' ? 'FRONTAL' : 'TRASEIRA'} ativa.`;
            return true;
        } catch(e) {
            try {
                const fallback = await navigator.mediaDevices.getUserMedia({ video: true });
                currentStream = fallback;
                video.srcObject = fallback;
                await video.play();
                return true;
            } catch(e2) { statusDiv.innerHTML = `🚫 Erro câmera: ${e2.message}`; return false; }
        }
    }
    
    async function switchCamera() {
        const newMode = currentFacingMode === "user" ? "environment" : "user";
        currentFacingMode = newMode;
        await initCamera(currentFacingMode);
    }
    
    function clearAll() {
        if (confirm("⚠️ Apagar TODOS os rostos cadastrados?")) {
            registeredUsers = [];
            nextId = 1;
            saveToLocalStorage();
            renderUserList();
            statusDiv.innerHTML = "🧹 Banco de dados limpo.";
        }
    }
    
    // LOAD MODELS (Essencial para o reconhecimento)
    async function loadModels() {
        statusDiv.innerHTML = "🧠 Baixando modelos de IA (Face Detection + Recognition)...";
        const modelUrl = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights';
        try {
            await faceapi.nets.tinyFaceDetector.loadFromUri(modelUrl);
            await faceapi.nets.faceLandmark68Net.loadFromUri(modelUrl);
            await faceapi.nets.faceRecognitionNet.loadFromUri(modelUrl);
            modelsLoaded = true;
            statusDiv.innerHTML = "✅ IA Pronta! Sistema de reconhecimento facial ativo.";
        } catch(e) {
            console.error(e);
            statusDiv.innerHTML = "❌ Erro ao carregar IA. Recarregue a página.";
        }
    }
    
    // Event listeners
    window.addEventListener('load', async () => {
        loadFromLocalStorage();
        await loadModels();
        await initCamera('user');
        startDetection();
        
        document.getElementById('btnRegister').onclick = () => startRegistration();
        document.getElementById('btnVerify').onclick = () => onVerify();
        document.getElementById('btnSwitchCamera').onclick = () => switchCamera();
        document.getElementById('clearAll').onclick = () => clearAll();
    });
</script>
</body>
</html>
