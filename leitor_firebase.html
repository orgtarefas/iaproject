<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor Firebase Completo - ConectClin</title>
</head>
<body>
    <h1>📊 Estrutura Completa do Firebase</h1>
    
    <button onclick="carregarTudo()" style="padding: 15px 30px; font-size: 1.2em; cursor: pointer;">
        🔍 Listar Todas as Coleções e Documentos
    </button>
    
    <div id="status" style="margin: 20px 0; font-size: 1.2em;"></div>
    <div id="stats" style="margin: 20px 0;"></div>
    <div id="resultado" style="margin-top: 20px;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBRnPddkN-QlcOELNu8gBxyT3MK3-pkXAc",
            authDomain: "conectclin-e1d4e.firebaseapp.com",
            projectId: "conectclin-e1d4e",
            storageBucket: "conectclin-e1d4e.firebasestorage.app",
            messagingSenderId: "771743976060",
            appId: "1:771743976060:web:b544abec3c2714dd3ad7f9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let totalColecoes = 0;
        let totalDocumentos = 0;
        let estruturaCompleta = {};

        async function carregarTudo() {
            document.getElementById('status').innerHTML = '⏳ Carregando estrutura completa...';
            document.getElementById('resultado').innerHTML = '';
            
            estruturaCompleta = {};
            totalColecoes = 0;
            totalDocumentos = 0;

            try {
                // Buscar todas as coleções raiz via API REST
                const collections = await listarColecoesRaiz();
                
                document.getElementById('status').innerHTML = `✅ Encontradas ${collections.length} coleções`;
                
                // Processar cada coleção
                for (const collectionName of collections) {
                    console.log(`Processando: ${collectionName}`);
                    estruturaCompleta[collectionName] = await processarColecao(collectionName);
                    totalColecoes++;
                }

                // Mostrar estatísticas
                document.getElementById('stats').innerHTML = `
                    <h2>📊 Estatísticas:</h2>
                    <p><strong>Total de Coleções:</strong> ${totalColecoes}</p>
                    <p><strong>Total de Documentos:</strong> ${totalDocumentos}</p>
                `;

                // Mostrar resultado
                mostrarResultado();
                
                // Exportar JSON no console
                console.log('📋 ESTRUTURA COMPLETA:');
                console.log(JSON.stringify(estruturaCompleta, null, 2));
                
                // Botão para copiar JSON
                document.getElementById('resultado').innerHTML += `
                    <button onclick="copiarJSON()" style="margin: 20px 0; padding: 10px 20px;">
                        📋 Copiar JSON Completo
                    </button>
                `;

            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('status').innerHTML = `❌ Erro: ${error.message}`;
            }
        }

        async function listarColecoesRaiz() {
            // Usando a API REST do Firestore para listar coleções
            const projectId = firebaseConfig.projectId;
            const apiKey = firebaseConfig.apiKey;
            
            try {
                // Método 1: Tentar via API REST
                const response = await fetch(
                    `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents?key=${apiKey}`
                );
                
                if (!response.ok) {
                    throw new Error('API REST não disponível');
                }
                
                const data = await response.json();
                const collections = new Set();
                
                if (data.documents) {
                    data.documents.forEach(doc => {
                        const parts = doc.name.split('/documents/')[1].split('/');
                        if (parts.length > 0) {
                            collections.add(parts[0]);
                        }
                    });
                }
                
                return Array.from(collections);
                
            } catch (error) {
                console.log('API REST falhou, tentando método alternativo...');
                return await listarColecoesAlternativo();
            }
        }

        async function listarColecoesAlternativo() {
            // Método alternativo: tentar coleções comuns
            const colecoesComuns = [
                'usuarios', 'users', 'pacientes', 'patients',
                'medicos', 'doctors', 'consultas', 'appointments',
                'clinicas', 'clinics', 'agendamentos', 'schedules',
                'exames', 'exams', 'receitas', 'prescriptions',
                'documentos', 'documents', 'config', 'settings',
                'logs', 'notificacoes', 'notifications'
            ];
            
            const colecoesExistentes = [];
            
            for (const nome of colecoesComuns) {
                try {
                    const snapshot = await db.collection(nome).limit(1).get();
                    if (!snapshot.empty) {
                        colecoesExistentes.push(nome);
                        console.log(`✅ Coleção encontrada: ${nome}`);
                    }
                } catch (e) {
                    // Coleção não existe
                }
            }
            
            return colecoesExistentes;
        }

        async function processarColecao(caminho) {
            try {
                const snapshot = await db.collection(caminho).get();
                const docs = [];
                
                totalDocumentos += snapshot.size;
                
                for (const doc of snapshot.docs) {
                    const dados = doc.data();
                    const subcolecoes = {};
                    
                    // Buscar subcoleções deste documento
                    const subs = await listarSubcolecoes(doc.ref);
                    
                    for (const subNome of subs) {
                        const subPath = `${caminho}/${doc.id}/${subNome}`;
                        subcolecoes[subNome] = await processarColecao(subPath);
                    }
                    
                    docs.push({
                        id: doc.id,
                        dados: dados,
                        subcolecoes: subcolecoes
                    });
                }
                
                return {
                    caminho: caminho,
                    totalDocumentos: snapshot.size,
                    documentos: docs
                };
                
            } catch (error) {
                console.error(`Erro ao processar ${caminho}:`, error);
                return {
                    caminho: caminho,
                    totalDocumentos: 0,
                    documentos: [],
                    erro: error.message
                };
            }
        }

        async function listarSubcolecoes(docRef) {
            const subcolecoesComuns = [
                'items', 'itens', 'documentos', 'documents',
                'arquivos', 'files', 'historico', 'history',
                'registros', 'records', 'anexos', 'attachments',
                'mensagens', 'messages', 'comentarios', 'comments'
            ];
            
            const existentes = [];
            
            for (const nome of subcolecoesComuns) {
                try {
                    const snap = await docRef.collection(nome).limit(1).get();
                    if (!snap.empty) {
                        existentes.push(nome);
                    }
                } catch (e) {
                    // Não existe
                }
            }
            
            return existentes;
        }

        function mostrarResultado() {
            let html = '<h2>📁 Estrutura Hierárquica Completa</h2>';
            
            for (const [nomeColecao, dados] of Object.entries(estruturaCompleta)) {
                html += `<div style="margin: 20px 0; padding: 15px; border: 2px solid #667eea; border-radius: 10px;">`;
                html += `<h3>📁 ${nomeColecao} (${dados.totalDocumentos} documentos)</h3>`;
                
                if (dados.documentos && dados.documentos.length > 0) {
                    dados.documentos.forEach((doc, index) => {
                        html += `<div style="margin: 10px 0; padding: 10px; background: #f5f5f5; margin-left: 20px;">`;
                        html += `<strong>📄 Documento ${index + 1}: ${doc.id}</strong><br>`;
                        html += '<div style="margin-left: 20px;">';
                        
                        // Mostrar campos
                        if (doc.dados) {
                            html += '<strong>Campos:</strong><br>';
                            for (const [chave, valor] of Object.entries(doc.dados)) {
                                let valorMostrado = valor;
                                if (valor instanceof firebase.firestore.Timestamp) {
                                    valorMostrado = valor.toDate().toLocaleString('pt-BR');
                                } else if (typeof valor === 'object') {
                                    valorMostrado = JSON.stringify(valor);
                                }
                                html += `• ${chave}: ${valorMostrado}<br>`;
                            }
                        }
                        
                        // Mostrar subcoleções
                        if (doc.subcolecoes && Object.keys(doc.subcolecoes).length > 0) {
                            html += '<div style="margin-top: 10px; padding: 10px; background: #fff3e0;">';
                            html += '<strong>📂 Subcoleções:</strong><br>';
                            for (const [subNome, subDados] of Object.entries(doc.subcolecoes)) {
                                html += `└─ ${subNome} (${subDados.totalDocumentos} docs)<br>`;
                            }
                            html += '</div>';
                        }
                        
                        html += '</div></div>';
                    });
                } else {
                    html += '<p style="color: #999;">Coleção vazia</p>';
                }
                
                html += '</div>';
            }
            
            document.getElementById('resultado').innerHTML = html;
        }

        function copiarJSON() {
            const jsonString = JSON.stringify(estruturaCompleta, null, 2);
            navigator.clipboard.writeText(jsonString).then(() => {
                alert('✅ JSON copiado! Verifique também o console (F12)');
            });
        }
    </script>
</body>
</html>
