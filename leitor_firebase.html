<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexão Firebase</title>
</head>
<body>
    <h1>Teste de Conexão Firebase</h1>
    <p id="status">Conectando...</p>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <script>
        // Sua configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRnPddkN-QlcOELNu8gBxyT3MK3-pkXAc",
            authDomain: "conectclin-e1d4e.firebaseapp.com",
            projectId: "conectclin-e1d4e",
            storageBucket: "conectclin-e1d4e.firebasestorage.app",
            messagingSenderId: "771743976060",
            appId: "1:771743976060:web:b544abec3c2714dd3ad7f9"
        };

        // Inicializar Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Verificar conexão
        console.log("Firebase conectado:", app.name);
        document.getElementById("status").innerHTML = "✅ Conectado com sucesso!";
        console.log("Firestore disponível:", db);
        console.log("Storage disponível:", storage);
    </script>
</body>
</html>
